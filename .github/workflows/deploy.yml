name: Auto Deploy to EC2 (Python)

on:
  push:
    branches:
      - dev   

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: |
            echo "🚀 Deploy started"
            echo "👤 User: $(whoami)"
            echo "🏠 Home: $HOME"
      
            cd "$HOME/mirrormindsproj/minds_complete_check" || {
              echo "❌ Error: Directory not found at $HOME/mirrormindsproj/minds_complete_check"
              ls -la "$HOME" || true
              exit 1
            }
      
            git reset --hard
            git pull origin dev
      
            if [ -f requirements.txt ]; then
              pip install -r requirements.txt
            fi
      
            sudo systemctl restart mirrorminds.service || true
      
            echo "✅ Deploy completed"
      